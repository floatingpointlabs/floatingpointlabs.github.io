<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Floating Point Labs</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: #0a0a0f;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      overflow: hidden;
    }

    /* Subtle radial glow behind the logo */
    body::before {
      content: "";
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -60%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .logo-wrap {
      width: 260px;
      height: 260px;
      position: relative;
    }

    #logo {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Wave draws itself */
    #wave-path {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: draw-wave 0.9s cubic-bezier(0.4, 0, 0.2, 1) 0.4s forwards;
    }

    @keyframes draw-wave {
      to {
        stroke-dashoffset: 0;
      }
    }

    /* Dot falls from top of viewport */
    #dot {
      opacity: 0;
      transform: translateY(-70vh);
      animation: drop-dot 0.65s 1.25s forwards;
    }

    @keyframes drop-dot {
      0% {
        opacity: 1;
        transform: translateY(-70vh);
      }

      60% {
        transform: translateY(6px);
      }

      75% {
        transform: translateY(-5px);
      }

      88% {
        transform: translateY(3px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 0.75rem;
      opacity: 0;
      animation: fade-up 0.6s ease 2s forwards;
    }

    h1 span {
      background: linear-gradient(135deg, #6366f1, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      color: #64748b;
      font-size: 1rem;
      max-width: 360px;
      opacity: 0;
      animation: fade-up 0.6s ease 2.2s forwards;
    }

    @keyframes fade-up {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    footer {
      position: fixed;
      bottom: 1.5rem;
      font-size: 0.8rem;
      color: #334155;
      opacity: 0;
      animation: fade-up 0.6s ease 2.4s forwards;
    }
  </style>
</head>

<body>
  <div class="logo-wrap">
    <svg id="logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#6366f1" />
          <stop offset="100%" stop-color="#a78bfa" />
        </linearGradient>
      </defs>

      <!-- Wave -->
      <path id="wave-path" fill="none" stroke="url(#wave-grad)" stroke-linejoin="round" stroke-width="8.8"
        d="M14 41q8.2-18.8 17.6-11.1t18 .3" />

      <!-- Dot -->
      <circle id="dot" cx="40.8" cy="22.2" r="5.1" fill="#8b5cf6" />
    </svg>
  </div>

  <h1>Floating Point <span>Labs</span></h1>
  <p>Something is in the works. Check back soon.</p>
  <footer>&copy; 2026 Floating Point Labs</footer>

  <script>
    // Set the actual path length for a pixel-perfect draw animation
    const path = document.getElementById('wave-path');
    const len = path.getTotalLength();
    path.style.strokeDasharray = len;
    path.style.strokeDashoffset = len;
  </script>
</body>

</html>
