<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Floating Point Labs</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;700;800&family=Anek+Telugu:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="bg-grid"></div>

  <div class="logo-wrap">
    <svg id="logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#6366f1" />
          <stop offset="100%" stop-color="#a78bfa" />
        </linearGradient>
        <radialGradient id="dot-grad" cx="38%" cy="32%" r="65%">
          <stop offset="0%" stop-color="#b89cf7" />
          <stop offset="100%" stop-color="#7c3aed" />
        </radialGradient>
      </defs>

      <!-- Wave -->
      <path id="wave-path" fill="none" stroke="url(#wave-grad)" stroke-linejoin="round" stroke-width="8.8"
        d="M14 41q8.2-18.8 17.6-11.1t18 .3" />

      <!-- Dot -->
      <circle id="dot" cx="40.8" cy="22.2" r="5.1" fill="url(#dot-grad)" />
    </svg>
  </div>

  <h1>Floating Point <span>Labs</span></h1>
  <p>Something is in the works. Check back soon.</p>
  <footer>&copy; 2026 Floating Point Labs Inc.</footer>

  <script src="main.js"></script>
</body>

</html>
