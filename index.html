<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Floating Point Labs</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background-color: #0a0a0f;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      overflow: hidden;
    }

    /* Vignette so the dot grid fades out at the edges */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 80% 80% at 50% 50%, transparent 40%, #0a0a0f 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* Central glow behind the logo */
    body::before {
      content: "";
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -60%);
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.28) 0%, transparent 65%);
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      animation: blob-appear 1.4s ease 1.9s forwards;
    }

    @keyframes blob-appear {
      to {
        opacity: 1;
      }
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(99, 102, 241, 0.18) 1px, transparent 1px);
      background-size: 30px 30px;
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      animation: blob-appear 1.4s ease 1.9s forwards;
    }

    .logo-wrap {
      width: 260px;
      height: 260px;
      position: relative;
      z-index: 2;
    }

    h1,
    p,
    footer {
      position: relative;
      z-index: 2;
    }

    #logo {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Wave draws itself */
    #wave-path {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: draw-wave 0.9s cubic-bezier(0.4, 0, 0.2, 1) 0.4s forwards;
    }

    @keyframes draw-wave {
      to {
        stroke-dashoffset: 0;
      }
    }

    /* Dot falls from top of viewport */
    #dot {
      opacity: 0;
      transform: translateY(-70vh);
      animation: drop-dot 0.65s 1.25s forwards,
        dot-glow-pulse 3s ease-in-out 1.9s infinite;
    }

    @keyframes dot-glow-pulse {

      0%,
      100% {
        filter: drop-shadow(0 0 4px rgba(167, 139, 250, 0.6));
      }

      50% {
        filter: drop-shadow(0 0 14px rgba(196, 181, 253, 0.95));
      }
    }

    @keyframes drop-dot {
      0% {
        opacity: 1;
        transform: translateY(-70vh);
      }

      60% {
        transform: translateY(6px);
      }

      75% {
        transform: translateY(-5px);
      }

      88% {
        transform: translateY(3px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 0.75rem;
      opacity: 0;
      animation: fade-up 0.6s ease 2s forwards;
    }

    h1 span {
      background: linear-gradient(135deg, #6366f1, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      color: #64748b;
      font-size: 1rem;
      max-width: 360px;
      opacity: 0;
      animation: fade-up 0.6s ease 2.2s forwards;
    }

    @keyframes fade-up {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    footer {
      position: fixed;
      bottom: 1.5rem;
      font-size: 0.8rem;
      color: #334155;
      opacity: 0;
      animation: fade-up 0.6s ease 2.4s forwards;
    }
  </style>
</head>

<body>
  <div class="bg-grid"></div>

  <div class="logo-wrap">
    <svg id="logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#6366f1" />
          <stop offset="100%" stop-color="#a78bfa" />
        </linearGradient>
        <radialGradient id="dot-grad" cx="38%" cy="32%" r="65%">
          <stop offset="0%" stop-color="#b89cf7" />
          <stop offset="100%" stop-color="#7c3aed" />
        </radialGradient>
      </defs>

      <!-- Wave -->
      <path id="wave-path" fill="none" stroke="url(#wave-grad)" stroke-linejoin="round" stroke-width="8.8"
        d="M14 41q8.2-18.8 17.6-11.1t18 .3" />

      <!-- Dot -->
      <circle id="dot" cx="40.8" cy="22.2" r="5.1" fill="url(#dot-grad)" />
    </svg>
  </div>

  <h1>Floating Point <span>Labs</span></h1>
  <p>Something is in the works. Check back soon.</p>
  <footer>&copy; 2026 Floating Point Labs</footer>

  <script>
    // Set the actual path length for a pixel-perfect draw animation
    const path = document.getElementById('wave-path');
    const len = path.getTotalLength();
    path.style.strokeDasharray = len;
    path.style.strokeDashoffset = len;

    // Impact effects when the dot first hits at ~60% of drop-dot (1250ms delay + 390ms = 1640ms)
    const DOT_LANDS_MS = 1640;

    function createFlash(x, y) {
      const el = document.createElement('div');
      Object.assign(el.style, {
        position: 'fixed',
        left: x + 'px',
        top: y + 'px',
        width: '500px',
        height: '500px',
        borderRadius: '50%',
        background: 'radial-gradient(circle, rgba(139,92,246,0.45) 0%, rgba(99,102,241,0.18) 35%, transparent 70%)',
        transform: 'translate(-50%, -50%) scale(0)',
        pointerEvents: 'none',
        zIndex: '40',
      });
      document.body.appendChild(el);
      el.animate([
        {opacity: 1, transform: 'translate(-50%, -50%) scale(0)'},
        {opacity: 0.9, transform: 'translate(-50%, -50%) scale(1)', offset: 0.18},
        {opacity: 0, transform: 'translate(-50%, -50%) scale(1.6)'},
      ], {duration: 900, easing: 'ease-out', fill: 'forwards'}).onfinish = () => el.remove();
    }

    function spawnParticles(x, y) {
      const palette = ['#8b5cf6', '#6366f1', '#a78bfa', '#c4b5fd', '#7c3aed', '#818cf8'];
      const count = 14;
      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        const angle = (i / count) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
        const dist = 28 + Math.random() * 48;
        const size = 2 + Math.random() * 2.5;
        const color = palette[i % palette.length];
        const dur = 480 + Math.random() * 320;
        Object.assign(el.style, {
          position: 'fixed',
          left: x + 'px',
          top: y + 'px',
          width: size + 'px',
          height: size + 'px',
          borderRadius: '50%',
          background: color,
          pointerEvents: 'none',
          zIndex: '60',
        });
        document.body.appendChild(el);
        const tx = Math.cos(angle) * dist;
        const ty = Math.sin(angle) * dist;
        el.animate([
          {opacity: 1, transform: `translate(-50%, -50%)`},
          {opacity: 0, transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px))`},
        ], {duration: dur, easing: 'cubic-bezier(0.2, 0.6, 0.4, 1)', fill: 'forwards'}).onfinish = () => el.remove();
      }
    }

    function shakeWrap() {
      document.querySelector('.logo-wrap').animate([
        {transform: 'translate(0, 0)'},
        {transform: 'translate(-3px, 2px)'},
        {transform: 'translate(3px, -2px)'},
        {transform: 'translate(-2px, 1px)'},
        {transform: 'translate(1px, -1px)'},
        {transform: 'translate(0, 0)'},
      ], {duration: 280, easing: 'ease-out'});
    }

    setTimeout(() => {
      const dotEl = document.getElementById('dot');
      const r = dotEl.getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const cy = r.top + r.height / 2;

      shakeWrap();
      createFlash(cx, cy);
      spawnParticles(cx, cy);
    }, DOT_LANDS_MS);

    // ── Glowing dots background ────────────────────────────────────────────
    (function () {
      const canvas = document.createElement('canvas');
      Object.assign(canvas.style, {
        position: 'fixed', inset: '0', width: '100%', height: '100%',
        pointerEvents: 'none', zIndex: '1',
      });
      document.body.prepend(canvas);
      const ctx = canvas.getContext('2d');

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      const palette = ['#a78bfa', '#818cf8', '#c4b5fd', '#6366f1', '#8b5cf6'];

      const dots = Array.from({length: 14}, () => ({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        r: 1 + Math.random() * 1.5,
        vx: (Math.random() - 0.5) * 0.1,
        vy: (Math.random() - 0.5) * 0.1,
        color: palette[Math.floor(Math.random() * palette.length)],
        baseAlpha: 0.18 + Math.random() * 0.15,
        glowRadius: 6 + Math.random() * 8,
        twinkleSpeed: 0.0003 + Math.random() * 0.0005,
        twinklePhase: Math.random() * Math.PI * 2,
      }));

      let globalOpacity = 0;

      function draw(t) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (const d of dots) {
          d.x += d.vx;
          d.y += d.vy;
          if (d.x < -20) d.x = canvas.width + 20;
          if (d.x > canvas.width + 20) d.x = -20;
          if (d.y < -20) d.y = canvas.height + 20;
          if (d.y > canvas.height + 20) d.y = -20;

          const twinkle = 0.55 + 0.45 * Math.sin(t * d.twinkleSpeed + d.twinklePhase);
          const a = d.baseAlpha * twinkle * globalOpacity;
          if (a < 0.005) continue;

          ctx.save();
          ctx.fillStyle = d.color;
          // Soft outer glow
          ctx.globalAlpha = a * 0.35;
          ctx.beginPath();
          ctx.arc(d.x, d.y, d.r + d.glowRadius, 0, Math.PI * 2);
          ctx.fill();
          // Tighter inner glow
          ctx.globalAlpha = a * 0.65;
          ctx.beginPath();
          ctx.arc(d.x, d.y, d.r + d.glowRadius * 0.35, 0, Math.PI * 2);
          ctx.fill();
          // Bright core
          ctx.globalAlpha = a;
          ctx.shadowColor = d.color;
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        requestAnimationFrame(draw);
      }

      setTimeout(() => {
        const t0 = performance.now();
        const FADE_DUR = 1400;
        function fade(now) {
          globalOpacity = Math.min(1, (now - t0) / FADE_DUR);
          if (globalOpacity < 1) requestAnimationFrame(fade);
        }
        requestAnimationFrame(fade);
        requestAnimationFrame(draw);
      }, 1900);
    })();
  </script>
</body>

</html>
