pre-commit:
  parallel: false
  jobs:
    - name: lint
      glob: "*.{js,mjs,cjs,ts,astro}"
      run: npx eslint --fix {staged_files}
      stage_fixed: true
    - name: format
      glob: "*.{js,mjs,cjs,ts,astro,json,md,css,yml,yaml}"
      run: npx prettier --write {staged_files}
      stage_fixed: true
